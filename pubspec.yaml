name: Kikoff
description: "KickOff - App สำหรับการจองสนามฟุตบอล"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  google_fonts: ^8.0.2
  cupertino_icons: ^1.0.8
  introduction_screen: ^4.0.0
  smooth_page_indicator: ^2.0.1
  shared_preferences: ^2.5.4
  firebase_core: ^4.4.0
  firebase_auth: ^6.1.4
  get: ^4.7.3
  cloud_firestore: ^6.1.2
  table_calendar: ^3.1.2
  intl: ^0.20.2
  image_picker: ^1.0.7
  firebase_storage: ^13.1.0
  http: ^1.3.0 #

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - lib/images/